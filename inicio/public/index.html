<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1 class="center">Gestor administrativo tech mahindra</h1>
    <img src="img/Tech_Mahindra.png" alt="Tech Mahindra" class="logo">
  </header>

  <main>
    <div class="login-box">
      <h2>Iniciar sesión</h2>

      <form id="loginForm">
        <input type="text" id="usuario" name="username" placeholder="Usuario" required>
        <input type="password" id="contrasena" name="password" placeholder="Contraseña" required>
        <button type="submit">Entrar</button>
      </form>

      <p id="loginError" style="margin-top:10px; color:#e74c3c; display:none;"></p>

      <p class="register-text">
        ¿No tienes cuenta?
        <a href="page2.html">Regístrate</a>
      </p>
    </div>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const err = document.getElementById("loginError");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      err.style.display = "none";
      err.textContent = "";

      const body = {
        username: document.getElementById("usuario").value.trim(),
        password: document.getElementById("contrasena").value.trim(),
      };

      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });

      const data = await res.json().catch(() => ({}));

      if (res.ok && data.ok) {
        window.location.href = "page3.html";
      } else {
        err.textContent = data.message || "Error al iniciar sesión.";
        err.style.display = "block";
      }
    });
  </script>

</body>
</html>
