<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<header>
  <h1 class="center">Gestor administrativo tech mahindra</h1>
  <img src="/img/Tech_Mahindra.png" class="logo" alt="Tech Mahindra">
</header>

<main>
  <div class="login-box">
    <h2>Iniciar sesión</h2>

    <form id="loginForm">
      <input type="text" id="username" placeholder="Usuario" required>
      <input type="password" id="password" placeholder="Contraseña" required>
      <button type="submit">Entrar</button>
    </form>

    
    <p id="error" style="display:none; margin-top:10px;"></p>

    <p class="register-text">
      ¿No tienes cuenta?
      <a href="/page2.html">Regístrate</a>
    </p>
  </div>
</main>

<footer>
  © 2026 Tech Mahindra
</footer>

<script>
  const form = document.getElementById("loginForm");
  const error = document.getElementById("error");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    error.style.display = "none";
    error.textContent = "";

    const body = {
      username: document.getElementById("username").value.trim(),
      password: document.getElementById("password").value.trim(),
    };

    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });

    const data = await res.json().catch(() => ({}));

    if (res.ok && data.ok) {
      window.location.href = "/app/page3";
    } else {
      error.style.color = "red";
      error.textContent = data.message || "Cuenta no encontrada o contraseña incorrecta.";
      error.style.display = "block";
    }
  });
</script>

</body>
</html>
